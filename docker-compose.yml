# For local development only
services:
  test-pelicanclan-pg-service:
    image: postgres:latest
    container_name: test-pelicanclan-pg-container
    restart: always
    environment:
      POSTGRES_USER: test_pelicanclan_user
      POSTGRES_PASSWORD: dummypassword123
      POSTGRES_DB: test_pelicanclan_db
    ports:
      - "3348:5432"
    volumes:
      - ./test_pelicanclan_pg_volume:/var/lib/postgresql
